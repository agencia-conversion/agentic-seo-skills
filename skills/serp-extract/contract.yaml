version: 1
module: serp-extract
canonical_path: "${report_dir}/serp-extract/${run_slug}/report.md"
source_artifact_pattern: "audits/serp-${run_slug}/report.yaml"
required_frontmatter: []
required_sections:
  - id: executive_summary
    headings: ["Resumo executivo", "Executive summary"]
  - id: organic_results
    headings: ["Resultados orgânicos", "Organic results"]
  - id: serp_features
    headings: ["SERP features"]
required_tables:
  - id: organic_results
    section:
      headings: ["Resultados orgânicos", "Organic results"]
    min_rows: 0
    columns:
      - key: position
        aliases: ["posicao"]
      - key: title
        aliases: ["titulo"]
      - key: domain
        aliases: ["dominio"]
      - key: url
