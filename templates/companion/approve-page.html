<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SEO Brain · Aprovar página</title>
<!--CONTEXT-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --card: #ffffff; --border: #e3e3e8;
    --text: #1c1c1e; --muted: #6e6e73; --accent: #0a84ff;
    --ok: #2f9e44; --danger: #ff3b30; --warn: #b25a00;
    --warn-bg: rgba(255,159,10,0.08);
    --add-bg: rgba(47,158,68,0.10); --add-text: #2f9e44;
    --del-bg: rgba(255,59,48,0.10); --del-text: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --border: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --warn: #ffb84d; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  .strategic-pill { background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  h1 code { background: var(--bg); padding: 2px 8px; border-radius: 6px; font-size: 16px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 18px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .fm-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 13px; gap: 8px; }
  .fm-row span:first-child { color: var(--muted); }
  .fm-row span:last-child { font-weight: 500; text-align: right; word-break: break-word; }
  .badge-status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(255,159,10,0.25); }

  .decision-options { display: flex; flex-direction: column; gap: 8px; }
  .decision-options label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; }
  .decision-options label:has(input:checked) { border-color: var(--accent); background: rgba(10,132,255,0.06); }
  .decision-options strong { display: block; }
  .decision-options small { color: var(--muted); }

  .summary-list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  .summary-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .summary-list li:last-child { border-bottom: none; }
  .summary-list .count { font-weight: 700; }
  .summary-list .alert { color: var(--danger); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; font-family: inherit; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--border); color: var(--text); font-size: 11px; }

  .pane { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-height: 200px; }
  .pane.active { display: block; }
  .pane.markdown { line-height: 1.65; font-size: 14px; }
  .pane.markdown h1, .pane.markdown h2, .pane.markdown h3 { margin: 1.2em 0 0.4em; }
  .pane.markdown table { border-collapse: collapse; width: 100%; }
  .pane.markdown td, .pane.markdown th { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
  .pane pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.45; white-space: pre; }
  .diff-add { color: var(--add-text); background: var(--add-bg); display: block; }
  .diff-del { color: var(--del-text); background: var(--del-bg); display: block; }
  .diff-meta { color: var(--muted); display: block; }
  .empty { color: var(--muted); font-style: italic; padding: 12px 0; font-size: 13px; }

  .source-list { list-style: none; padding: 0; margin: 0; }
  .source-list li { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, monospace; }
  .source-list .alert { color: var(--danger); }

  form.bottom { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; padding: 20px 0 0; border-top: 1px solid var(--border); }
  form.bottom h2 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  form.bottom label { font-size: 13px; }
  form.bottom textarea, form.bottom input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; resize: vertical; }
  form.bottom textarea { min-height: 60px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  button { padding: 11px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .primary { background: var(--accent); color: #fff; }
  .primary:disabled { opacity: 0.5; cursor: wait; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .alert-box, .ok-box { padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .alert-box { background: rgba(255,59,48,0.10); color: var(--danger); }
  .ok-box { background: rgba(47,158,68,0.12); color: var(--ok); }
  .footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span><span id="strategic-tag"></span> Aprovação de página</span>
    <span id="approver-display"></span>
  </div>
  <h1><code id="page-name">page</code></h1>

  <div class="grid-2">
    <div class="panel">
      <h2>Frontmatter</h2>
      <div id="fm-content"></div>
    </div>
    <div class="panel">
      <h2>Resumo</h2>
      <ul class="summary-list" id="summary-list"></ul>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="page">Página renderizada</button>
    <button class="tab" data-tab="diff">Diff</button>
    <button class="tab" data-tab="missing">Fontes não registradas <span class="pill" id="pill-missing">0</span></button>
    <button class="tab" data-tab="broken">Wikilinks quebrados <span class="pill" id="pill-broken">0</span></button>
  </div>

  <div class="pane active markdown" id="pane-page" data-pane="page"></div>
  <div class="pane" id="pane-diff" data-pane="diff"></div>
  <div class="pane" id="pane-missing" data-pane="missing"></div>
  <div class="pane" id="pane-broken" data-pane="broken"></div>

  <form class="bottom" id="form" autocomplete="off">
    <div>
      <h2>Decisão</h2>
      <div class="decision-options" id="decision-opts" style="margin-top:8px;">
        <label><input type="radio" name="decision" value="approved" required /><span><strong>Registrar decisão</strong><small>registra entrada de decisão no brain/log.md</small></span></label>
        <label><input type="radio" name="decision" value="needs-evidence" /><span><strong>Falta evidência</strong><small>marcar para coletar fontes antes de avançar</small></span></label>
        <label><input type="radio" name="decision" value="rejected" /><span><strong>Rejeitar</strong><small>agente deve reescrever</small></span></label>
      </div>
    </div>
    <div>
      <label for="approver">Registrando como</label>
      <input id="approver" name="approver" type="text" placeholder="agent" />
    </div>
    <div>
      <label for="notes">Observação (opcional)</label>
      <textarea id="notes" name="notes" placeholder="Motivo da decisão, evidências faltando, próximos passos..."></textarea>
    </div>
    <div class="row" id="register-row" style="display:none;">
      <label><input type="checkbox" id="register_missing" name="register_missing" /> Registrar fontes faltando como entradas <code>tipo: ingestao</code> em <code>brain/log.md</code> ao avançar</label>
    </div>
    <div id="error" class="alert-box" style="display:none;"></div>
    <div id="success" class="ok-box" style="display:none;">Decisão registrada. Pode fechar esta aba.</div>
    <div class="actions">
      <button type="button" class="ghost" id="cancel-btn">Cancelar</button>
      <button type="submit" class="primary" id="submit-btn">Confirmar decisão</button>
    </div>
  </form>

  <div class="footer">Janela local · 127.0.0.1 efêmero · revisão de página autoral do brain</div>
</div>

<script>
(function () {
  const ctx = window.__CONTEXT__ || {};
  const path = window.location.pathname;

  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

  if (ctx.isAuthorial) {
    document.getElementById("strategic-tag").innerHTML = '<span class="strategic-pill">autoral</span>';
  }
  document.getElementById("page-name").textContent = ctx.file || "(arquivo)";
  if (ctx.identity?.name) {
    document.getElementById("approver").value = ctx.identity.name;
    document.getElementById("approver-display").textContent = "registrando como " + ctx.identity.name;
  }

  const fmEl = document.getElementById("fm-content");
  const fm = ctx.frontmatter || {};
  const fmKeys = ["title", "updated"];
  fmEl.innerHTML = fmKeys
    .filter((k) => k in fm)
    .map((k) => {
      const v = Array.isArray(fm[k]) ? fm[k].join(", ") : fm[k];
      return `<div class="fm-row"><span>${k}</span><span>${escape(v || "—")}</span></div>`;
    })
    .join("");

  const summaryList = document.getElementById("summary-list");
  const sourcesCount = (ctx.sources || []).length;
  const missingCount = (ctx.missingSources || []).length;
  const brokenCount = (ctx.brokenLinks || []).length;
  const items = [
    { label: "Fontes citadas", value: sourcesCount, alert: false },
    { label: "Fontes não registradas no log", value: missingCount, alert: missingCount > 0 },
    { label: "Wikilinks quebrados", value: brokenCount, alert: brokenCount > 0 },
    { label: "Diff disponível", value: ctx.diff?.hasPrevious ? "sim" : "não", alert: false },
  ];
  summaryList.innerHTML = items
    .map((i) => `<li><span>${i.label}</span><span class="count ${i.alert ? "alert" : ""}">${i.value}</span></li>`)
    .join("");

  document.getElementById("pill-missing").textContent = missingCount;
  document.getElementById("pill-broken").textContent = brokenCount;

  // Markdown render: minimal — headers, bold, italic, links, code, paragraphs
  function mdToHtml(md) {
    const lines = md.split(/\r?\n/);
    let html = "";
    let inCode = false;
    let codeBuf = [];
    for (let line of lines) {
      if (/^```/.test(line)) {
        if (inCode) { html += "<pre><code>" + escape(codeBuf.join("\n")) + "</code></pre>"; codeBuf = []; inCode = false; }
        else { inCode = true; }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (/^### /.test(line)) html += "<h3>" + inline(line.slice(4)) + "</h3>";
      else if (/^## /.test(line)) html += "<h2>" + inline(line.slice(3)) + "</h2>";
      else if (/^# /.test(line)) html += "<h1>" + inline(line.slice(2)) + "</h1>";
      else if (/^\s*-\s+/.test(line)) html += "<li>" + inline(line.replace(/^\s*-\s+/, "")) + "</li>";
      else if (/^\s*\|.*\|\s*$/.test(line)) html += renderTableRow(line);
      else if (line.trim() === "") html += "";
      else html += "<p>" + inline(line) + "</p>";
    }
    return html.replace(/(<li>.*?<\/li>)+/g, "<ul>$&</ul>");
  }
  function inline(s) {
    return escape(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[\[([^\]|]+)(\|([^\]]+))?\]\]/g, (_, a, _b, c) => "<em>" + (c || a) + "</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function renderTableRow(line) {
    const cells = line.split("|").slice(1, -1).map((c) => "<td>" + inline(c.trim()) + "</td>").join("");
    return "<table><tr>" + cells + "</tr></table>";
  }

  document.getElementById("pane-page").innerHTML = ctx.body ? mdToHtml(ctx.body) : '<div class="empty">corpo vazio</div>';

  // Diff render
  const diffPane = document.getElementById("pane-diff");
  if (!ctx.diff?.hasPrevious) {
    diffPane.innerHTML = '<div class="empty">Primeira decisão — não há versão anterior para comparar.</div>';
  } else if (!ctx.diff.unified.trim()) {
    diffPane.innerHTML = '<div class="empty">Sem mudanças no corpo desde o último snapshot registrado.</div>';
  } else {
    const lines = ctx.diff.unified.split("\n").map((line) => {
      if (/^\+/.test(line) && !/^\+\+\+/.test(line)) return '<span class="diff-add">' + escape(line) + "</span>";
      if (/^-/.test(line) && !/^---/.test(line)) return '<span class="diff-del">' + escape(line) + "</span>";
      if (/^@@|^diff |^index |^---|^\+\+\+/.test(line)) return '<span class="diff-meta">' + escape(line) + "</span>";
      return escape(line);
    }).join("\n");
    diffPane.innerHTML = "<pre>" + lines + "</pre>";
  }

  // Missing sources
  const missingPane = document.getElementById("pane-missing");
  if (!missingCount) missingPane.innerHTML = '<div class="empty">Todas as fontes citadas têm entradas <code>tipo: ingestao</code> em <code>brain/log.md</code>.</div>';
  else missingPane.innerHTML = '<ul class="source-list">' + ctx.missingSources.map((p) => `<li class="alert">${escape(p)}</li>`).join("") + "</ul>";
  if (missingCount) document.getElementById("register-row").style.display = "";

  // Broken links
  const brokenPane = document.getElementById("pane-broken");
  if (!brokenCount) brokenPane.innerHTML = '<div class="empty">Nenhum wikilink quebrado.</div>';
  else brokenPane.innerHTML = '<ul class="source-list">' + ctx.brokenLinks.map((l) => `<li class="alert">[[${escape(l)}]]</li>`).join("") + "</ul>";

  // Tabs
  document.getElementById("tabs").addEventListener("click", (e) => {
    if (!e.target.matches(".tab")) return;
    const name = e.target.dataset.tab;
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
    document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("active", p.dataset.pane === name));
  });

  const form = document.getElementById("form");
  const errEl = document.getElementById("error");
  const okEl = document.getElementById("success");
  const btn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Registrando...";
    const data = Object.fromEntries(new FormData(form));
    data.register_missing = !!form.register_missing?.checked;
    try {
      const resp = await fetch(path + "/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const json = await resp.json();
      if (json.ok) {
        okEl.style.display = "";
        setTimeout(() => { try { window.close(); } catch (_) {} }, 1500);
      } else {
        errEl.textContent = "Erro: " + (json.reason || "desconhecido") + (json.details ? " — " + json.details : "");
        errEl.style.display = "";
        btn.disabled = false;
        btn.textContent = "Confirmar decisão";
      }
    } catch (err) {
      errEl.textContent = "Erro de rede: " + err.message;
      errEl.style.display = "";
      btn.disabled = false;
      btn.textContent = "Confirmar decisão";
    }
  });

  document.getElementById("cancel-btn").addEventListener("click", async () => {
    try { await fetch(path + "/cancel", { method: "POST" }); } catch (_) {}
    try { window.close(); } catch (_) {}
  });
})();
</script>
</body>
</html>
