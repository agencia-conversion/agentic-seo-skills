<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Agentic SEO · Revisão do Brain</title>
<!--CONTEXT-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --card: #ffffff; --border: #e3e3e8;
    --text: #1c1c1e; --muted: #6e6e73; --accent: #0a84ff;
    --ok: #2f9e44; --danger: #ff3b30; --warn: #b25a00;
    --add-bg: rgba(47,158,68,0.10); --add-text: #2f9e44;
    --del-bg: rgba(255,59,48,0.10); --del-text: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --border: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --warn: #ffb84d; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .summary { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; }
  .summary strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  .file-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }

  .file-head { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; padding: 14px 18px 12px; align-items: center; }
  .file-name { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; font-weight: 600; }
  .file-meta { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .file-status { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 11px; }
  .badge.accepted { background: rgba(47,158,68,0.12); color: var(--ok); }
  .badge.edited { background: rgba(10,132,255,0.12); color: var(--accent); }
  .badge.unchanged { background: rgba(178,90,0,0.12); color: var(--warn); }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--border); color: var(--text); }
  .pill.polish { background: rgba(10,132,255,0.12); color: var(--accent); }
  .pill.restructure { background: rgba(178,90,0,0.12); color: var(--warn); }
  .pill.section-cut { background: rgba(255,59,48,0.10); color: var(--danger); }
  .pill.claim-softened { background: rgba(178,90,0,0.12); color: var(--warn); }
  .pill.ai-tells-flagged { background: rgba(152,152,157,0.18); color: var(--muted); }

  .head-actions { display: flex; gap: 6px; align-self: start; }
  .restore-btn { padding: 6px 11px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; white-space: nowrap; }
  .restore-btn:hover { background: var(--bg); }
  .restore-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .tabs { display: flex; gap: 0; padding: 0 12px; background: var(--bg); border-top: 1px solid var(--border); }
  .tab { padding: 10px 14px; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 500; font-family: inherit; border-radius: 8px 8px 0 0; margin: 6px 2px 0; position: relative; top: 1px; border: 1px solid transparent; border-bottom: none; }
  .tab.active { color: var(--text); background: var(--card); border-color: var(--border); border-bottom-color: var(--card); }
  .tab:hover:not(.active) { color: var(--text); }

  .pane { display: none; padding: 16px 18px; border-top: 1px solid var(--border); margin-top: -1px; }
  .pane.active { display: block; }
  .editor-pane textarea { width: 100%; min-height: 360px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; line-height: 1.55; resize: vertical; }
  .editor-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  pre.code-block { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; line-height: 1.45; white-space: pre; margin: 0; max-height: 520px; font-family: ui-monospace, SFMono-Regular, monospace; }
  .diff-add { color: var(--add-text); background: var(--add-bg); display: block; }
  .diff-del { color: var(--del-text); background: var(--del-bg); display: block; }
  .diff-ctx { display: block; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; font-size: 13px; }

  .notes-pane h3 { margin: 16px 0 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .notes-pane h3:first-child { margin-top: 0; }
  .notes-pane ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .notes-pane li { margin-bottom: 6px; }
  .notes-pane .arrow { color: var(--muted); margin: 0 6px; }
  .notes-pane .reason { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
  .notes-pane code { background: var(--bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  form.bottom { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; padding: 20px 0 0; border-top: 1px solid var(--border); }
  form.bottom h2 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  form.bottom label { font-size: 13px; }
  form.bottom textarea, form.bottom input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 14px; font-family: inherit; resize: vertical; }
  form.bottom textarea { min-height: 60px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  button.cta { padding: 11px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .primary { background: var(--accent); color: #fff; }
  .primary:disabled { opacity: 0.5; cursor: wait; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .alert-box, .ok-box { padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .alert-box { background: rgba(255,59,48,0.10); color: var(--danger); }
  .ok-box { background: rgba(47,158,68,0.12); color: var(--ok); }
  .footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span>Revisão do Brain</span>
    <span id="approver-display"></span>
  </div>
  <h1>O agente reescreveu algumas páginas. Confira antes de salvar.</h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="summary" id="summary"></div>
  <div id="files"></div>

  <form class="bottom" id="form" autocomplete="off">
    <div>
      <label for="approver">Quem está revisando</label>
      <input id="approver" name="approver" type="text" placeholder="agent" />
    </div>
    <div>
      <label for="notes">Notas (opcional)</label>
      <textarea id="notes" name="notes" placeholder="Contexto, ressalvas, próxima iteração..."></textarea>
    </div>
    <div id="error" class="alert-box" style="display:none;"></div>
    <div id="success" class="ok-box" style="display:none;">Salvo. Pode fechar essa aba.</div>
    <div class="actions">
      <button type="button" class="cta ghost" id="cancel-btn">Cancelar</button>
      <button type="submit" class="cta primary" id="submit-btn">Salvar tudo</button>
    </div>
  </form>

  <div class="footer">Janela local · 127.0.0.1 efêmero · revisão do Brain do Agentic SEO</div></div>

<script>
(function () {
  const ctx = window.__CONTEXT__ || {};
  const path = window.location.pathname;
  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

  const files = ctx.files || [];
  document.getElementById("subtitle").textContent =
    `${files.length} página(s). Edite direto no Editor; o que estava lá antes fica em "Como estava". Quando terminar, "Salvar tudo".`;
  document.getElementById("summary").innerHTML = ctx.proposalSummary
    ? `<strong>O que o agente fez no geral</strong>${escape(ctx.proposalSummary)}`
    : '<span style="color:var(--muted);">Sem resumo do reviewer.</span>';

  if (ctx.identity?.name) {
    document.getElementById("approver").value = ctx.identity.name;
    document.getElementById("approver-display").textContent = "revisando como " + ctx.identity.name;
  }

  function lcsDiff(a, b) {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        if (a[i] === b[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
        else dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { out.push(["ctx", a[i]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(["del", a[i]]); i++; }
      else { out.push(["add", b[j]]); j++; }
    }
    while (i < n) { out.push(["del", a[i++]]); }
    while (j < m) { out.push(["add", b[j++]]); }
    return out;
  }
  function renderDiff(left, right, emptyMsg) {
    if (left === right) return `<div class="empty">${emptyMsg}</div>`;
    const lines = lcsDiff(left.split("\n"), right.split("\n"));
    const html = lines.map(([t, line]) => {
      const prefix = t === "add" ? "+" : t === "del" ? "-" : " ";
      const cls = t === "add" ? "diff-add" : t === "del" ? "diff-del" : "diff-ctx";
      return `<span class="${cls}">${escape(prefix + line)}</span>`;
    }).join("");
    return `<pre class="code-block">${html}</pre>`;
  }

  function renderRemoved(items) {
    if (!items.length) return '<div class="empty">Nada cortado.</div>';
    return "<ul>" + items.map((i) => `<li><strong>${escape(i.name)}</strong> — ${escape(i.reason)}</li>`).join("") + "</ul>";
  }
  function renderSoftened(items) {
    if (!items.length) return '<div class="empty">Nada suavizado.</div>';
    return "<ul>" + items.map((i) =>
      `<li>"${escape(i.original)}"<span class="arrow">→</span>"${escape(i.final || "(removido)")}"<span class="reason">${escape(i.reason)}</span></li>`
    ).join("") + "</ul>";
  }
  function renderFlagged(items) {
    if (!items.length) return '<div class="empty">Nada sinalizado.</div>';
    return "<ul>" + items.map((i) => `<li><code>${escape(i)}</code></li>`).join("") + "</ul>";
  }
  function renderSummaryBullets(items) {
    if (!items.length) return '<div class="empty">Sem detalhamento.</div>';
    return "<ul>" + items.map((i) => `<li>${escape(i)}</li>`).join("") + "</ul>";
  }

  const state = files.map((f) => ({ path: f.path, current: f.v2Content, v1: f.v1Content, v2: f.v2Content }));

  function classify(idx) {
    const s = state[idx];
    if (s.current === s.v1) return { key: "unchanged", label: "voltou ao original" };
    if (s.current === s.v2) return { key: "accepted", label: "mantendo a proposta" };
    return { key: "edited", label: "você editou" };
  }

  function refreshStatus(idx) {
    const c = classify(idx);
    const headEl = document.getElementById(`head-status-${idx}`);
    if (headEl) headEl.innerHTML = `<span class="badge ${c.key}">${c.label}</span>`;
    const v1Btn = document.querySelector(`#card-${idx} [data-action="restore-v1"]`);
    const v2Btn = document.querySelector(`#card-${idx} [data-action="restore-v2"]`);
    if (v1Btn) v1Btn.disabled = state[idx].current === state[idx].v1;
    if (v2Btn) v2Btn.disabled = state[idx].current === state[idx].v2;
  }

  function refreshActiveDiff(idx) {
    const tab = document.querySelector(`#card-${idx} .tab.active`)?.dataset.tab;
    if (tab === "diff-v1") {
      document.getElementById(`pane-diff-v1-${idx}`).innerHTML =
        renderDiff(state[idx].v1, state[idx].current, "Igual ao original. Nada foi mudado ainda.");
    } else if (tab === "diff-v2") {
      document.getElementById(`pane-diff-v2-${idx}`).innerHTML =
        renderDiff(state[idx].v2, state[idx].current, "Você não editou em cima da proposta.");
    }
  }

  const filesContainer = document.getElementById("files");
  filesContainer.innerHTML = files.map((f, idx) => {
    const pills = (f.changeTypes || []).map((t) => `<span class="pill ${escape(t)}">${escape(t)}</span>`).join("");
    return `
      <div class="file-card" id="card-${idx}">
        <div class="file-head">
          <div>
            <div class="file-name">${escape(f.path)}</div>
          </div>
          <div class="head-actions">
            <button type="button" class="restore-btn" data-action="restore-v1" data-idx="${idx}" title="Descarta as mudanças do agente nesta página">Voltar ao original</button>
            <button type="button" class="restore-btn" data-action="restore-v2" data-idx="${idx}" title="Descarta suas edições e volta para o que o agente sugeriu">Voltar à proposta</button>
          </div>
          <div class="file-meta">
            <span class="file-status" id="head-status-${idx}"></span>
            <div class="pills">${pills}</div>
          </div>
        </div>
        <div class="tabs">
          <button type="button" class="tab active" data-tab="editor">Editar</button>
          <button type="button" class="tab" data-tab="diff-v1">O que mudou no total</button>
          <button type="button" class="tab" data-tab="diff-v2">Suas edições</button>
          <button type="button" class="tab" data-tab="original">Como estava</button>
          <button type="button" class="tab" data-tab="notes">Por que o agente mexeu</button>
        </div>
        <div class="pane editor-pane active" data-pane="editor">
          <textarea id="ta-${idx}" spellcheck="false">${escape(state[idx].current)}</textarea>
          <p class="editor-hint">Frontmatter (entre <code>---</code>) é editável também. Salvar valida que continua parseando.</p>
        </div>
        <div class="pane" data-pane="diff-v1"><div id="pane-diff-v1-${idx}"><div class="empty">Mude para esta aba para calcular.</div></div></div>
        <div class="pane" data-pane="diff-v2"><div id="pane-diff-v2-${idx}"><div class="empty">Mude para esta aba para calcular.</div></div></div>
        <div class="pane" data-pane="original"><pre class="code-block">${escape(f.v1Content)}</pre></div>
        <div class="pane notes-pane" data-pane="notes">
          <h3>Resumo das mudanças</h3>
          ${renderSummaryBullets(f.diffSummary)}
          <h3>Seções cortadas</h3>
          ${renderRemoved(f.removedSections || [])}
          <h3>Alegações suavizadas</h3>
          ${renderSoftened(f.softenedClaims || [])}
          <h3>AI-tells sinalizados (não removidos)</h3>
          ${renderFlagged(f.aiTellsFlagged || [])}
        </div>
      </div>
    `;
  }).join("");

  files.forEach((_, idx) => {
    const ta = document.getElementById(`ta-${idx}`);
    ta.addEventListener("input", () => {
      state[idx].current = ta.value;
      refreshStatus(idx);
    });
    refreshStatus(idx);
  });

  filesContainer.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (tab) {
      const card = tab.closest(".file-card");
      card.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
      const name = tab.dataset.tab;
      card.querySelectorAll(".pane").forEach((p) => p.classList.toggle("active", p.dataset.pane === name));
      const idx = Number(card.id.replace("card-", ""));
      refreshActiveDiff(idx);
      return;
    }
    const restore = e.target.closest("[data-action]");
    if (restore && !restore.disabled) {
      const idx = Number(restore.dataset.idx);
      const which = restore.dataset.action === "restore-v1" ? state[idx].v1 : state[idx].v2;
      state[idx].current = which;
      document.getElementById(`ta-${idx}`).value = which;
      refreshStatus(idx);
      refreshActiveDiff(idx);
    }
  });

  const form = document.getElementById("form");
  const errEl = document.getElementById("error");
  const okEl = document.getElementById("success");
  const btn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Salvando...";
    const filesPayload = {};
    state.forEach((s) => { filesPayload[s.path] = s.current; });
    const data = {
      files: filesPayload,
      approver: document.getElementById("approver").value,
      notes: document.getElementById("notes").value,
    };
    try {
      const resp = await fetch(path + "/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const json = await resp.json();
      if (json.ok) {
        okEl.style.display = "";
        setTimeout(() => { try { window.close(); } catch (_) {} }, 1500);
      } else {
        errEl.textContent = "Erro: " + (json.reason || "desconhecido") + (json.details ? " — " + JSON.stringify(json.details) : "");
        errEl.style.display = "";
        btn.disabled = false;
        btn.textContent = "Salvar tudo";
      }
    } catch (err) {
      errEl.textContent = "Erro de rede: " + err.message;
      errEl.style.display = "";
      btn.disabled = false;
      btn.textContent = "Salvar tudo";
    }
  });

  document.getElementById("cancel-btn").addEventListener("click", async () => {
    try { await fetch(path + "/cancel", { method: "POST" }); } catch (_) {}
    try { window.close(); } catch (_) {}
  });
})();
</script>
</body>
</html>
